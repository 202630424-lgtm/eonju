    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #FFF5E4 0%, #FFE3E1 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #2D3748;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(235, 130, 130, 0.15);
            text-align: center;
            max-width: 440px;
            width: 100%;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        .badge {
            display: inline-block;
            background-color: #FFEAE6;
            color: #FF6B6B;
            font-size: 14px;
            font-weight: 600;
            padding: 6px 16px;
            border-radius: 20px;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 26px;
            font-weight: 800;
            color: #1A202C;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 15px;
            color: #718096;
            margin-bottom: 30px;
        }

        .result-box {
            background: #FAFAFA;
            border: 2px dashed #E2E8F0;
            border-radius: 20px;
            padding: 30px 20px;
            margin-bottom: 30px;
            transition: all 0.3s ease;
            min-height: 220px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .emoji {
            font-size: 80px;
            line-height: 1.2;
            margin-bottom: 12px;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            user-select: none;
        }

        .menu-name {
            font-size: 24px;
            font-weight: 700;
            color: #2D3748;
            margin-bottom: 6px;
            min-height: 36px;
        }

        .menu-desc {
            font-size: 14px;
            color: #A0AEC0;
        }

        .btn {
            width: 100%;
            background: linear-gradient(135deg, #FF6B6B 0%, #FF8E53 100%);
            color: white;
            border: none;
            padding: 18px 24px;
            font-size: 18px;
            font-weight: 700;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(255, 107, 107, 0.3);
            transition: all 0.2s ease;
            outline: none;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 24px rgba(255, 107, 107, 0.4);
        }

        .btn:active {
            transform: translateY(1px);
            box-shadow: 0 6px 12px rgba(255, 107, 107, 0.3);
        }

        /* Animation */
        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15) rotate(5deg); }
        }

        .animate {
            animation: bounce 0.4s ease-in-out;
        }
    </style>
</head>
<body>

    <div class="container">
        <span class="badge">오늘 뭐 먹지?</span>
        <h1>저녁 메뉴 추천</h1>
        <p class="subtitle">결정을 내리기 힘들 땐 버튼을 눌러보세요!</p>

        <div class="result-box">
            <div id="emoji" class="emoji">🍴</div>
            <div id="menuName" class="menu-name">버튼을 눌러주세요</div>
            <div id="menuDesc" class="menu-desc">맛있는 저녁 메뉴를 추천해드립니다</div>
        </div>

        <button class="btn" onclick="recommendMenu()">저녁 메뉴 추천</button>
    </div>

    <script>
        const menuList = [
            { name: "삼겹살", emoji: "🥓", desc: "노릇노릇 고소한 삼겹살과 파채!" },
            { name: "치킨", emoji: "🍗", desc: "바삭바삭 맛있는 오늘 밤 치느님" },
            { name: "피자", emoji: "🍕", desc: "치즈가 쭉쭉 늘어나는 고소한 피자" },
            { name: "초밥", emoji: "🍣", desc: "신선하고 깔끔한 정갈한 초밥" },
            { name: "라면", emoji: "🍜", desc: "얼큰하고 칼칼한 국물이 당길 때" },
            { name: "떡볶이", emoji: "🍢", desc: "매콤달콤 국민 간식 떡볶이와 튀김" },
            { name: "햄버거", emoji: "🍔", desc: "육즙 가득 수제버거와 감자튀김" },
            { name: "돈가스", emoji: "🥩", desc: "겉바속촉 바삭한 돈가스 한 점" },
            { name: "짜장면 & 짬뽕", emoji: "🥢", desc: "고민될 땐 둘 다! 중화요리 대표주자" },
            { name: "카레", emoji: "🍛", desc: "진한 풍미의 따뜻한 카레라이스" },
            { name: "파스타", emoji: "🍝", desc: "부드러운 크림 또는 상큼한 토마토 파스타" },
            { name: "스테이크", emoji: "🥩", desc: "기분 내고 싶은 날 완벽한 한 끼" },
            { name: "타코", emoji: "🌮", desc: "이국적인 맛과 매력이 가득한 타코" },
            { name: "국밥", emoji: "🍲", desc: "든든하고 뜨끈한 한 단골 메뉴 국밥" },
            { name: "비빔밥", emoji: "🥗", desc: "신선한 야채와 고추장의 환상 조화" }
        ];

        let isSpinning = false;

        function recommendMenu() {
            if (isSpinning) return;
            isSpinning = true;

            const emojiEl = document.getElementById('emoji');
            const menuNameEl = document.getElementById('menuName');
            const menuDescEl = document.getElementById('menuDesc');

            let counter = 0;
            const maxCounts = 15;
            const interval = setInterval(() => {
                const randomTemp = menuList[Math.floor(Math.random() * menuList.length)];
                emojiEl.innerText = randomTemp.emoji;
                menuNameEl.innerText = randomTemp.name;
                menuDescEl.innerText = "추천 중...";
                counter++;

                if (counter >= maxCounts) {
                    clearInterval(interval);
                    const finalMenu = menuList[Math.floor(Math.random() * menuList.length)];
                    
                    emojiEl.innerText = finalMenu.emoji;
                    menuNameEl.innerText = finalMenu.name;
                    menuDescEl.innerText = finalMenu.desc;

                    // 애니메이션 효과 적용
                    emojiEl.classList.add('animate');
                    setTimeout(() => {
                        emojiEl.classList.remove('animate');
                    }, 400);

                    isSpinning = false;
                }
            }, 80);
        }
    </script>
</body>
</html>

with open("dinner_menu_recommendation.html", "w", encoding="utf-8") as f:
    f.write(html_content)

print("HTML 파일 생성 완료")
